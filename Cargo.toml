[workspace]
resolver = "2"
members = ["core", "daemon", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Florian MAZEN (F4FEZ)"]
license = "Apache-2.0"
repository = "https://github.com/florianmazen/fez-mesh-controller"
description = "Controller and monitor for a MeshCore network"

[workspace.dependencies]
fez-mesh-controller-core = { path = "core" }
meshcore-rs = "0.2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true

# Temporary: use the local meshcore-rs checkout (with the get_/set_autoadd_config
# commands needed for observer_node_managed_config) instead of the published
# crates.io version, until they're merged and released. RawData/LogData decoding
# and the tokio feature trim landed in the published 0.2.0.
[patch.crates-io]
meshcore-rs = { path = "../meshcore-rs" }
