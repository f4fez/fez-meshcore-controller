# Example configuration for fez-mesh-controller.
#
# The interactive setup wizard (`fez-mesh-controller`, run when no config
# file exists yet, or `fez-mesh-controller setup`) generates this file for
# you — you normally don't need to write it by hand. This example documents
# every available parameter, in case you want to edit it directly or
# provision it out-of-band (e.g. for a headless node).
#
# Default location: ~/.config/fez-mesh-controller/config.toml
# (override with `--config <path>` on both the daemon and the CLI).

# Display name used to identify this controller in the UIs.
node_label = "fez-mesh-controller"

# --- Connection to the local MeshCore node -----------------------------
#
# Exactly one connection method is active: the `type` key selects it.
# Uncomment the block you want and remove (or comment out) the others.

# Serial (USB/UART) — the most common way to reach a companion radio.
[connection]
type = "serial"
port = "/dev/ttyUSB0"       # e.g. /dev/tty.usbserial-XXXX on macOS
baud_rate = 115200

# TCP — e.g. firmware exposing a network gateway.
# [connection]
# type = "tcp"
# host = "192.168.1.42"
# port = 5000

# Bluetooth Low Energy — by advertised device name.
# [connection]
# type = "ble"
# name = "MeshCore-XXXXXX"

# --- Daemon settings -----------------------------------------------------

[daemon]
# Path of the Unix socket used for daemon <-> CLI IPC. Auto-generated by
# the wizard (under the XDG runtime directory when available); only
# override this if you're running multiple independent instances.
socket_path = "/run/user/1000/fez-mesh-controller.sock"

# Interval (seconds) between periodic state refreshes (self info, uptime).
refresh_interval_secs = 5

# Log level: error, warn, info, debug or trace.
log_level = "info"

# Directory for the daily-rotating log files written when the daemon runs
# in the background (`--daemon`). Ignored in foreground mode, where logs
# go to the console instead.
log_dir = "/home/user/.local/state/fez-mesh-controller/logs"

# Number of raw RF packets kept in the daemon's rotating packet-log cache
# (the TUI's "Packet log" page, F3), oldest evicted first. Optional,
# defaults to 500 if omitted.
packet_log_capacity = 500

# --- Managed repeaters -----------------------------------------------------
#
# Repeaters this application actively manages: shown as "🛰️ Managed" in the
# TUI's contact list and automatically (re-)declared as companion contacts
# on every (re)connect, using the full public key below. Add entries here,
# or manage them interactively from the TUI's contact list (press `m` on a
# selected contact).

# [[managed_repeaters]]
# name = "F4FEZ Repeater"
# public_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd"
