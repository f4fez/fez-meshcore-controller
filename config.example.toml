# Example configuration for fez-mesh-controller.
#
# The interactive setup wizard (`fez-mesh-controller`, run when no config
# file exists yet, or `fez-mesh-controller setup`) generates this file for
# you — you normally don't need to write it by hand. This example documents
# every available parameter, in case you want to edit it directly or
# provision it out-of-band (e.g. for a headless node).
#
# Default location: ~/.config/fez-mesh-controller/config.toml
# (override with `--config <path>` on both the daemon and the CLI).

# Display name used to identify this controller in the UIs.
node_label = "fez-mesh-controller"

# --- Connection to the local MeshCore node -----------------------------
#
# Exactly one connection method is active: the `type` key selects it.
# Uncomment the block you want and remove (or comment out) the others.

# Serial (USB/UART) — the most common way to reach a companion radio.
[connection]
type = "serial"
port = "/dev/ttyUSB0"       # e.g. /dev/tty.usbserial-XXXX on macOS
baud_rate = 115200

# TCP — e.g. firmware exposing a network gateway.
# [connection]
# type = "tcp"
# host = "192.168.1.42"
# port = 5000

# Bluetooth Low Energy — by advertised device name.
# [connection]
# type = "ble"
# name = "MeshCore-XXXXXX"

# --- Daemon settings -----------------------------------------------------

[daemon]
# Path of the Unix socket used for daemon <-> CLI IPC. Auto-generated by
# the wizard (under the XDG runtime directory when available); only
# override this if you're running multiple independent instances.
socket_path = "/run/user/1000/fez-mesh-controller.sock"

# Interval (seconds) between periodic state refreshes (self info, uptime).
refresh_interval_secs = 5

# Log level: error, warn, info, debug or trace.
log_level = "info"

# Directory for the daily-rotating log files written when the daemon runs
# in the background (`--daemon`). Ignored in foreground mode, where logs
# go to the console instead.
log_dir = "/home/user/.local/state/fez-mesh-controller/logs"

# Number of raw RF packets kept in the daemon's rotating packet-log cache
# (the TUI's "Packet log" page, F3), oldest evicted first. Optional,
# defaults to 500 if omitted.
packet_log_capacity = 500

# Path of the SQLite database persisting overheard-but-not-yet-a-contact
# nodes (repeaters/room servers detected purely from RF traffic, not yet in
# the companion's own contact list) across daemon restarts. Optional,
# defaults to <state dir>/fez-mesh-controller/repeaters.sqlite3 if omitted.
db_path = "/home/user/.local/state/fez-mesh-controller/repeaters.sqlite3"

# When true, the daemon actively locks this node down to an observer-only
# state on every (re)connect: disables the node's own contact auto-add,
# removes every channel (Public and private/hashtag), and prunes any
# contact that isn't listed under managed_repeaters below. Prompted by the
# setup wizard's Connection section. Optional, defaults to true if omitted.
observer_node_managed_config = true

# --- Managed repeaters -----------------------------------------------------
#
# Repeaters this application tracks, each with a configured tier -- both are
# automatically (re-)declared as companion contacts on every (re)connect
# (using the full public key below) and protected from observer-node
# pruning; only the TUI badge/behavior differs:
#
#   "managed"    -- full current behavior, shown as "🛰️  Managed". Default
#                   when the key is omitted.
#   "known"      -- registered/protected like "managed", but shown as
#                   "📟 Known" (the deliberate, config-driven version of a
#                   companion contact that just isn't actively managed).
#   "supervised" -- reserved for future telemetry-based health monitoring;
#                   behaves exactly like "managed" today, shown as
#                   "🛡️  Supervised" so it's visually distinguishable ahead
#                   of that feature.
#
# Add entries here, or set them interactively from the TUI's contact list:
# `m` (managed), `k` (known), `s` (supervised) toggle the selected repeater's
# tier -- pressing the key matching its current tier removes it instead.

# [[managed_repeaters]]
# name = "F4FEZ Repeater"
# public_key_hex = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcd"
# managed = "managed"
#
# Admin or guest password for this repeater. Optional -- only needed for
# requests the repeater requires a login for (e.g. fetching its telemetry);
# stored in plaintext, like every other secret in this file.
# password = "hunter2"

# --- Region hierarchy (cluster) --------------------------------------------
#
# The cluster's region hierarchy, mirroring the MeshCore node firmware's own
# region concept (name + parent, forming a tree). Local to this controller
# only — not synced with the connected node's own configuration. Shown as
# the "Cluster" block on the dashboard, and used to recognize a packet's
# transport code (packet log detail popup): a region's transport key is
# derived deterministically from its name (no secret to provision), so any
# name you use here must match the name configured on the mesh's nodes for
# matching to work. Editable interactively via the setup wizard
# (`fez-mesh-controller setup`), including arrow-key hierarchy arrangement.

# [[regions]]
# name = "World"

# [[regions]]
# name = "Europe"
# parent = "World"

# [[regions]]
# name = "France"
# parent = "Europe"

# --- Hashtag channels --------------------------------------------------
#
# Names of MeshCore "Hashtag Channels" (docs/companion_protocol.md) to try
# decoding GroupText messages against, in addition to the well-known
# "Public" channel (always tried, no configuration needed). A hashtag
# channel's key is derived purely from its name (SHA256("#name"), first 16
# bytes) — like the Public channel, it's not actually private: anyone who
# knows or guesses the name can derive the key. Decoded messages show up in
# the packet log ("<channel>: <text>") and its detail popup. Not editable
# via the setup wizard yet — add entries here by hand.

# hashtag_channels = ["#test"]

# --- MQTT brokers --------------------------------------------------------
#
# Forwards received mesh events to one or more MQTT brokers, using the same
# topic structure and JSON message shape as the community
# `ipnet-mesh/meshcore-mqtt` bridge (verified against its source). The
# <prefix>/status topic instead matches the community
# `agessaman/meshcore-packet-capture` bridge's richer status message shape
# (verified against its source). Editable via the setup wizard, or by hand
# below. `password` is stored in plaintext, like the rest of this file.

# [[mqtt_brokers]]
# name = "Home Assistant"
# host = "mqtt.example.com"
# port = 1883
# username = "fez"
# password = "hunter2"
# topic_prefix = "meshcore"
# status_topic = "{prefix}/status" # supports {prefix}/{public_key} placeholders, see below
# status_refresh_interval_secs = 300 # 0 disables the periodic status heartbeat
# enable_high_level_messages = true # false mutes this broker (connects, publishes nothing)
#
# Raw-packet topics: every overheard packet, regardless of whether this
# project's own decoders recognize it. Topic routes support {prefix} (this
# broker's topic_prefix) and {public_key} (this node's own uppercase public
# key hex) placeholders. See documentation/mqtt.md for full message shapes.
# enable_packet_trafic_messages = true  # rich schema (letsmesh-mqtt-auth.md / agessaman "packets")
# packet_trafic_topic = "{prefix}/packets"
# enable_raw_messages = false           # off by default; minimal envelope (agessaman "raw")
# raw_topic = "{prefix}/raw"
#
# Connection protocol: "tcp" (default) or "websocket". websocket_path is
# only used when transport_protocol = "websocket" (broker-specific, e.g.
# "/mqtt", "/ws").
# transport_protocol = "tcp"
# websocket_path = "/mqtt"
#
# tls_enabled = false
# tls_ca_cert = "/etc/mqtt/ca.pem"
# tls_client_cert = "/etc/mqtt/client.pem"
# tls_client_key = "/etc/mqtt/client.key"

# auth_method: "passwd" (default, uses username/password above), "device"
# (MeshCore device-signed token -- the node signs its own short-lived auth
# token on-device, the private key never leaves it; the MQTT username is
# derived automatically as v1_<node public key, uppercase hex>), or "none"
# (always anonymous). See documentation/mqtt.md's "Device-signed
# authentication" section.
#
# [[mqtt_brokers]]
# name = "LetsMesh (US)"
# host = "mqtt-us-v1.letsmesh.net"
# port = 443
# auth_method = "device"
# jwt_ttl_secs = 3600       # refreshed 6 minutes before expiry
# jwt_audience = "mqtt-us-v1.letsmesh.net" # "aud" claim; defaults to host above if omitted
# transport_protocol = "websocket"
# websocket_path = "/ws"
# tls_enabled = true
